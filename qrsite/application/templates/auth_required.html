{% extends 'base.html' %}

{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card shadow">
                <div class="card-body text-center">
                    <h2 class="card-title mb-4">{{ title }}</h2>
                    <p class="lead mb-4">Для создания QR-кодов необходимо войти в систему или зарегистрироваться.</p>
                    <div class="d-flex justify-content-center gap-3">
                        <a href="{% url 'login' %}?next={{ next }}" class="btn btn-primary">
                            <i class="fas fa-sign-in-alt me-2"></i>Войти
                        </a>
                        <a href="{% url 'register' %}?next={{ next }}" class="btn btn-success">
                            <i class="fas fa-user-plus me-2"></i>Зарегистрироваться
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
